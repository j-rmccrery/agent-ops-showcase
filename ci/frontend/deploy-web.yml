name: Deploy Web

# Per-environment web deploy pipeline.
#
# - Push to `rc`   -> deploy web export to the EAS Hosting "rc" alias (RC channel).
# - Push to `main` -> sync the web export to the prod S3 bucket and invalidate
#                     CloudFront.
#
# Required repo secrets and variables (Settings > Secrets and variables > Actions) — not
# provisioned by this workflow:
# - EXPO_TOKEN      Expo access token for the EAS project (scope to project if possible).
#                   Generate at https://expo.dev/settings/access-tokens
# - EAS_PROJECT_ID  EAS project id consumed by app.config.ts (extra.eas.projectId).
# - AWS_WEB_DEPLOY_ACCESS_KEY_ID / AWS_WEB_DEPLOY_SECRET_ACCESS_KEY
#                   IAM user keys for the prod web deploy (main path only).
# - WEB_BUCKET / CLOUDFRONT_DISTRIBUTION_ID
#                   Prod S3 bucket name and CloudFront distribution id, as repo variables (main path only).
#
# e2e-happy-path and short-screen (below) are the live-RC E2E gates for
# RC -> prod promotion. They run in this workflow, `needs: deploy-web`, so
# they always execute after this same run's RC deploy completes rather than
# racing it as a separate push-triggered workflow.

on:
  push:
    branches: [rc, main]

env:
  NODE_VERSION: "22"

jobs:
  deploy-web:
    name: Export + deploy web build
    runs-on: ubuntu-latest
    env:
      EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Node 22: eas-cli >= 22.4.0 (installed as `latest` below) requires
          # Node >= 22 via @oclif/plugin-autocomplete; Node 22 still bundles
          # npm 10, so `npm ci` lockfile behavior is unchanged.
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS CLI
        uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Deploy to RC
        if: github.ref == 'refs/heads/rc'
        run: npm run deploy:web:rc

      - name: Configure AWS credentials (prod web deploy)
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-access-key-id: ${{ secrets.AWS_WEB_DEPLOY_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_WEB_DEPLOY_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy to production
        if: github.ref == 'refs/heads/main'
        env:
          WEB_BUCKET: ${{ vars.WEB_BUCKET }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: npm run deploy:web:prod

  e2e-happy-path:
    name: E2E happy path (Playwright, live RC)
    # Gate for RC -> prod promotion, not every PR: runs on pushes to rc
    # (i.e. once a PR has merged into rc), sequenced via `needs: deploy-web`
    # so it only starts once this same workflow run has finished deploying
    # to RC.
    #
    # drives real headless Chromium against the live deployed RC web
    # app (${{ vars.APP_URL }}, default in scripts/qa/happy-path.ts)
    # through the app's own UI -- no mocked network, no local bundle, no
    # simulator. A CORS-level outage or an unreachable backend fails this
    # job for real, the way a real outage would. Sequenced
    # after the deploy for this SHA via `needs: deploy-web` above; the
    # remaining gap was EAS Hosting alias-propagation lag (the alias can take
    # a moment to start serving the export deploy-web just published) --
    # `needs:` only proves the deploy step returned success, not that the
    # live alias is actually serving *this* commit's export yet. Closed: the
    # "Verify RC deploy matches this commit" step below polls the deployed
    # build's own stamped SHA (scripts/build-info/write-build-info.ts writes
    # it into the export at a known path, /build-info.json; scripts/qa/
    # verify-build-sha.ts polls for a match, no fixed sleep) and fails the
    # job loud on a timeout or persistent mismatch, before Playwright ever
    # drives the app.
    #
    # MFA enrollment/challenge needs a live, retrieved email
    # OTP to get past -- otp-resolver.ts reads it from the SES-inbound-
    # to-S3 bucket. This job assumes the read-only, repo-scoped
    # role (vars.AWS_ROLE_ARN) via OIDC (id-token: write,
    # scoped to this job only) before running the flow; no long-lived AWS
    # credentials are stored in this repo.
    #
    # an earlier run sat with zero output for 6h before
    # manual cancel; the identical script passes locally in 42s. The
    # cancellation log's orphan-process dump proves exactly where it was
    # stuck: "Install Playwright Chromium" (npx playwright install
    # --with-deps chromium), specifically inside its internal `apt-get
    # update` -- the last log line before 6h of silence is a package-list
    # fetch from `azure.archive.ubuntu.com`/`archive.ubuntu.com`
    # (noble-updates InRelease). The QA script itself never started; nothing
    # in scripts/qa/ ran. So neither of the other two suspects (a
    # deploy-ordering race -- or the S3 OTP poll -- otp-resolver.ts,
    # which has its own timeoutMs deadline) was in play here: a stalled apt
    # mirror connection has no timeout of its own and blocked ahead of any
    # of this repo's code. `timeout-minutes` bounds the whole job (a normal
    # run completes in ~2m); the step-level timeout below targets the exact
    # step that hung, so a repeat fails in minutes with a clear "step timed
    # out" signal instead of consuming the full job budget in silence.
    needs: deploy-web
    timeout-minutes: 15
    if: github.ref == 'refs/heads/rc'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Configure AWS credentials (SES inbound QA reader)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - name: Verify RC deploy matches this commit
        # closes the alias-propagation-lag gap noted above -- polls
        # the deployed build's stamped SHA (see this job's header comment)
        # until it matches github.sha or this step's own timeout elapses.
        # Fails loud (non-zero, descriptive message) rather than letting
        # Playwright drive a build that may not be this commit's.
        timeout-minutes: 3
        run: npm run qa:verify-build-sha -- --timeout=150000
      - name: Install Playwright Chromium
        # this is the step that hung 6h in an earlier run (apt-get
        # update against a stalled mirror). Normal duration is ~25s.
        timeout-minutes: 5
        run: npx playwright install --with-deps chromium
      - name: Run the E2E happy path against the live RC web app
        # script-level defense in depth -- normal duration ~40s.
        # this used to pipe stdout through `tee "$GITHUB_STEP_SUMMARY"`
        # (with `set -o pipefail`, so tee's always-zero exit couldn't mask a
        # real failure). Both parts are gone now: the script writes its own
        # step -> status markdown table to $GITHUB_STEP_SUMMARY (happy-path.ts),
        # and two writers on that one file would collide -- `tee` opens
        # it truncating at pipeline start, then writes the JSON blob from
        # offset 0 over whatever the script appended. Dropping the pipe also
        # drops the need for pipefail: npm's own exit code is the step's.
        # The raw JSON is still in this step's log.
        #
        # QA_PERSISTENT_TEST_EMAIL/PASSWORD select persistent-account
        # mode (test-account.ts's persistentTestAccount()) -- unset until the
        # one-time manual setup (sign up, enroll MFA, finish onboarding
        # through the real app) is done, at which point set them as repo
        # secrets here and this job switches modes automatically. Until then
        # the ephemeral flow's dashboard/detail steps run fixture-backed.
        timeout-minutes: 5
        shell: bash
        env:
          QA_PERSISTENT_TEST_EMAIL: ${{ secrets.QA_PERSISTENT_TEST_EMAIL }}
          QA_PERSISTENT_TEST_PASSWORD: ${{ secrets.QA_PERSISTENT_TEST_PASSWORD }}
        run: npm run qa:happy-path

  short-screen:
    name: Short-screen layout guard (375×667, live RC)
    # proves the pinned auth footers render fully on-screen (not
    # clipped) on the shortest supported device (iPhone SE 2/3, 375×667) via
    # real headless Chromium against the live deployed RC web app. Layout only
    # — native-render bugs are out of scope and need a simulator, not a web
    # browser. Covers /sign-in and /sign-up (no session needed) plus
    # account-settings: that surface signs in as the persistent test account
    # (same OtpResolver/AWS role as e2e-happy-path) and reaches it
    # via Settings, same as e2e-happy-path's settings step -- see
    # scripts/qa/short-screen-client.ts's header for the full rationale. When
    # QA_PERSISTENT_TEST_EMAIL/PASSWORD aren't set, account-settings's step
    # reports skipped (not fail) rather than being attempted.
    #
    # This job is gated to push-to-rc only (same gating as e2e-happy-path), NOT
    # on pull_request: this drives the LIVE deployed RC web app, which on a PR
    # is still the already-deployed code, not the PR's -- so a PR run could
    # neither validate the PR's own change nor avoid false-gating unrelated PRs
    # on the deployed app's state. It is a post-merge promotion signal for
    # rc -> prod (per docs/architecture/testing-strategy.md, live checks don't
    # run on PRs), not a blocking PR gate. Sequenced after the deploy for this
    # SHA via `needs: deploy-web` above, same as e2e-happy-path; the
    # remaining gap was EAS Hosting alias-propagation lag, not deploy
    # ordering. Closed the same way as e2e-happy-path: this job's own
    # "Verify RC deploy matches this commit" step polls the deployed build's
    # stamped SHA before Playwright runs and fails loud on a timeout or
    # persistent mismatch.
    needs: deploy-web
    if: github.ref == 'refs/heads/rc'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Configure AWS credentials (SES inbound QA reader)
        # account-settings signs in as the persistent test account,
        # which needs the same live email-OTP retrieval e2e-happy-path uses.
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - name: Verify RC deploy matches this commit
        # see this job's header comment. Same gate as e2e-happy-path.
        timeout-minutes: 3
        run: npm run qa:verify-build-sha -- --timeout=150000
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run the short-screen layout guard against the live RC web app
        env:
          QA_PERSISTENT_TEST_EMAIL: ${{ secrets.QA_PERSISTENT_TEST_EMAIL }}
          QA_PERSISTENT_TEST_PASSWORD: ${{ secrets.QA_PERSISTENT_TEST_PASSWORD }}
        run: npm run qa:short-screen
